{% extends "base.html" %}
{% block title %}Kayıt Ol // OSINTCORE{% endblock %}
{% block head %}
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
{% endblock %}

{% block content %}
<div class="auth-box">
  <h2 style="margin-bottom:0.35rem;">Yeni Operatör Kaydı</h2>
  <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:1.5rem;">Ücretsiz araçlara sınırsız erişim + 15 PRO deneme kredisi kazanın.</p>

  <form method="POST" action="{{ url_for('register') }}">
    <div class="form-group">
      <label>Kullanıcı Adı</label>
      <input type="text" name="username" class="form-control" required minlength="3" placeholder="cyber_analyst">
    </div>
    <div class="form-group">
      <label>E-posta Adresi</label>
      <input type="email" name="email" class="form-control" required placeholder="analist@osintcore.io">
    </div>
    <div class="form-group">
      <label>Şifre (En az 6 karakter)</label>
      <input type="password" name="password" class="form-control" required minlength="6" placeholder="••••••••">
    </div>
    <div class="form-group" style="margin-top:1rem;">
      <div class="h-captcha" data-sitekey="{{ sitekey }}" data-theme="dark"></div>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Hesabı Oluştur</button>
  </form>

  <p style="margin-top:1.2rem; font-size:0.85rem; color:var(--text-muted); text-align:center;">
    Zaten üye misin? <a href="{{ url_for('login') }}" style="color:var(--accent);">Giriş Yap</a>
  </p>
</div>
{% endblock %}
