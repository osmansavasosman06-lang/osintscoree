{% extends "base.html" %}
{% block title %}Giriş Yap // OSINTCORE{% endblock %}
{% block head %}
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
{% endblock %}

{% block content %}
<div class="auth-box">
  <h2 style="margin-bottom:0.35rem;">Operatör Girişi</h2>
  <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:1.5rem;">OSINTCORE komuta merkezine erişmek için bilgilerinizi girin.</p>

  <form method="POST" action="{{ url_for('login') }}">
    <div class="form-group">
      <label>Kullanıcı Adı veya E-posta</label>
      <input type="text" name="identity" class="form-control" required placeholder="operator01">
    </div>
    <div class="form-group">
      <label>Şifre</label>
      <input type="password" name="password" class="form-control" required placeholder="••••••••">
    </div>
    <div class="form-group" style="margin-top:1rem;">
      <div class="h-captcha" data-sitekey="{{ sitekey }}" data-theme="dark"></div>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Doğrula ve Giriş Yap</button>
  </form>

  <p style="margin-top:1.2rem; font-size:0.85rem; color:var(--text-muted); text-align:center;">
    Hesabın yok mu? <a href="{{ url_for('register') }}" style="color:var(--accent);">Kayıt Ol</a>
  </p>
</div>
{% endblock %}
